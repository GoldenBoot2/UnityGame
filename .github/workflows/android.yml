name: Build Android

on:
  push:
    branches: [main]
    paths-ignore: ['**.md']
  workflow_dispatch:

jobs:
  android:
    name: Android APK
    runs-on: ubuntu-24.04
    timeout-minutes: 120
    steps:
      - name: Check Unity secrets
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        run: |
          if [ -z "$UNITY_LICENSE" ] || [ -z "$UNITY_EMAIL" ] || [ -z "$UNITY_PASSWORD" ]; then
            echo "::error::Missing secrets: UNITY_LICENSE, UNITY_EMAIL, UNITY_PASSWORD"
            exit 1
          fi

      - name: Free disk space
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /usr/local/.ghcup /opt/hostedtoolcache/CodeQL
          df -h /

      - uses: actions/checkout@v7

      - uses: actions/cache@v6
        with:
          path: Library
          key: Library-Android-${{ hashFiles('Assets/**', 'Packages/**', 'ProjectSettings/**') }}
          restore-keys: |
            Library-Android-

      - name: Build
        # Pinned to v5.0.1: v6 delegates to game-ci/cli, whose Personal .ulf activation fails with
        # "Code 400 TimeStamp validation failed" (game-ci/unity-test-runner issue 336, open since 13-10-2026).
        uses: game-ci/unity-builder@v5.0.1
        env:
          UNITY_LICENSE: ${{ secrets.UNITY_LICENSE }}
          UNITY_EMAIL: ${{ secrets.UNITY_EMAIL }}
          UNITY_PASSWORD: ${{ secrets.UNITY_PASSWORD }}
        with:
          targetPlatform: Android
          customImage: unityci/editor:ubuntu-6000.3.29f1-android-4
          buildName: BlockDodge
          buildMethod: BuildScript.BuildAndroid
          versioning: None
          androidVersionCode: ${{ github.run_number }}
          androidExportType: androidPackage

      - uses: actions/upload-artifact@v7
        with:
          name: BlockDodge-apk-${{ github.run_number }}
          path: build/Android/*.apk
          if-no-files-found: error
          retention-days: 14
